# This file was generated by Render's heroku-import Heroku CLI plugin
# https://www.npmjs.com/package/@renderinc/heroku-import
# Schema documented at https://render.com/docs/yaml-spec
services:
  - type: web
    name: eusomnia-backend
    env: python
    region: ohio
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn --chdir src wsgi:application"
    envVars:
      - key: FLASK_APP
        value: src/app.py
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: eusomnia-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "False"

  - type: static
    name: eusomnia-frontend
    env: static
    region: ohio
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: eusomnia-db
    region: ohio
    plan: free

