# Schema documented at https://render.com/docs/yaml-spec
services:
  - type: web
    name: eusomnia-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    region: oregon
    plan: free
    envVars:
      - key: FLASK_APP
        value: src/app.py
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: eusomnia-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "False"
      - key: PORT
        value: "10000"

  - type: web
    runtime: static
    name: eusomnia-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: "20"
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: eusomnia-backend
          property: host

databases:
  - name: eusomnia-db
    region: oregon
    plan: free
