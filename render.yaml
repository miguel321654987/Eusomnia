# Schema documented at https://render.com/docs/yaml-spec
services:
  - type: web
    name: eusomnia-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn --chdir src wsgi:application"
    envVars:
      - key: FLASK_APP
        value: src/app.py
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: eusomnia-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "False"

databases:
  - name: eusomnia-db
    region: oregon
    plan: free
